name: Build RECTI-FI Extended Modes for macOS Mojave

on:
  push:
    branches: [main]
    paths:
      - "RECTIFI_VST3_ExtendedModes_Source.zip"
      - ".github/workflows/build-mojave.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rectifi-extended-mojave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mojave:
    # An Intel runner produces x86_64 binaries; deployment target remains Mojave 10.14.
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Check out source archive
        uses: actions/checkout@v4

      - name: Validate and extract source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="RECTIFI_VST3_ExtendedModes_Source.zip"
          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p source
          unzip -q "$ARCHIVE" -d source
          CMAKE_FILE="$(find source -type f -name CMakeLists.txt -print -quit)"
          if [[ -z "$CMAKE_FILE" ]]; then
            echo "CMakeLists.txt was not found inside the source ZIP." >&2
            exit 1
          fi
          SOURCE_ROOT="$(dirname "$CMAKE_FILE")"
          test -f "$SOURCE_ROOT/build_mojave.sh"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "Source root: $SOURCE_ROOT"
          sw_vers
          xcode-select -p
          cmake --version
          git --version

      - name: Fix source compatibility with JUCE 6.1.6
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_ROOT/Source/PluginEditor.cpp" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          replacements = {
              "BinaryData::Archivo_Regular_ttfSize": "BinaryData::ArchivoRegular_ttfSize",
              "BinaryData::Archivo_Regular_ttf": "BinaryData::ArchivoRegular_ttf",
              "BinaryData::MartianMono_Bold_ttfSize": "BinaryData::MartianMonoBold_ttfSize",
              "BinaryData::MartianMono_Bold_ttf": "BinaryData::MartianMonoBold_ttf",
              "BinaryData::MartianMono_Regular_ttfSize": "BinaryData::MartianMonoRegular_ttfSize",
              "BinaryData::MartianMono_Regular_ttf": "BinaryData::MartianMonoRegular_ttf",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)

          marker = "void RectifiAudioProcessorEditor::savePresetFromDialog()"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("Could not find savePresetFromDialog(); refusing an unsafe patch.")
          end_marker = "\n}\n"
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit("Could not find the end of savePresetFromDialog(); refusing an unsafe patch.")
          end += 3
          old_function = source[start:end]
          if "runModalLoop()" not in old_function:
              if "enterModalState(true" not in old_function:
                  raise SystemExit("Preset dialog is neither the known legacy nor JUCE-6-compatible implementation.")
              path.write_text(source)
              print("Preset dialog is already JUCE 6.1.6 compatible; font resource names checked.")
              raise SystemExit(0)

          new_function = r'''void RectifiAudioProcessorEditor::savePresetFromDialog()
          {
              // JUCE 6.1.6 uses asynchronous modal callbacks instead of runModalLoop().
              auto* dialog = new juce::AlertWindow("Save RECTI-FI Preset",
                                                    "Name this preset:",
                                                    juce::AlertWindow::NoIcon);
              dialog->addTextEditor("presetName", "MY PRESET", "Preset name");
              dialog->addButton("SAVE", 1);
              dialog->addButton("CANCEL", 0);

              juce::Component::SafePointer<RectifiAudioProcessorEditor> safeThis(this);
              dialog->enterModalState(true,
                  juce::ModalCallbackFunction::create([safeThis, dialog](int result)
                  {
                      if (result != 1 || safeThis == nullptr)
                          return;

                      const auto name = dialog->getTextEditorContents("presetName").trim().substring(0, 32);
                      if (name.isEmpty() || !safeThis->processor.saveUserPreset(name))
                          return;

                      safeThis->refreshPresetNames();
                      const auto names = safeThis->allPresetNames();
                      for (int i = safeThis->builtInPresetNames.size(); i < names.size(); ++i)
                      {
                          if (names[i].equalsIgnoreCase(name))
                          {
                              safeThis->currentPresetIndex = i;
                              safeThis->presetNameLabel.setText(names[i].toUpperCase(), juce::dontSendNotification);
                              break;
                          }
                      }
                  }),
                  true);
          }
          '''
          source = source[:start] + new_function + source[end:]
          path.write_text(source)
          print("Patched embedded font identifiers and asynchronous preset dialog.")
          PY

      - name: Prepare JUCE 6.1.6 for the macOS 15 SDK
        shell: bash
        run: |
          set -euo pipefail
          JUCE_ROOT="$RUNNER_TEMP/JUCE-6.1.6"
          git clone --depth 1 --branch 6.1.6 https://github.com/juce-framework/JUCE.git "$JUCE_ROOT"

          # JUCE 6.1.6 references CGWindowListCreateImage, unavailable in the
          # macOS 15 SDK. The plug-in does not use JUCE native-window snapshots.
          # Patch only that helper so the older pinned JUCE version can compile.
          python3 - "$JUCE_ROOT/modules/juce_gui_basics/native/juce_mac_Windowing.mm" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          start_marker = "static Image createNSWindowSnapshot (NSWindow* nsWindow)"
          end_marker = "\nImage createSnapshotOfNativeWindow (void* nativeWindowHandle)"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0 or "CGWindowListCreateImage" not in source[start:end]:
              raise SystemExit("Could not locate the expected JUCE 6.1.6 snapshot helper; refusing an unsafe patch.")
          replacement = """static Image createNSWindowSnapshot (NSWindow* nsWindow)
          {
              ignoreUnused (nsWindow);
              return {};
          }
          """
          path.write_text(source[:start] + replacement + source[end:])
          print("Applied targeted JUCE 6.1.6 / macOS 15 SDK compatibility shim.")
          PY

          # Seed CMake's cache with this patched JUCE checkout; build_mojave.sh
          # reuses it on the second configure.
          cmake -S "$SOURCE_ROOT" -B "$SOURCE_ROOT/build_mojave" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 \
            -DJUCE_SOURCE_DIR="$JUCE_ROOT" \
            -DRECTIFI_BUILD_PLUGIN=ON \
            -DRECTIFI_BUILD_TESTS=ON

      - name: Build VST3 and run DSP tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          bash ./build_mojave.sh 2>&1 | tee "$GITHUB_WORKSPACE/RECTIFI_Mojave_Build.log"

      - name: Package compiled VST3
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_PATH="$(find "$SOURCE_ROOT/build_mojave" -type d -name '*.vst3' -print -quit)"
          if [[ -z "$PLUGIN_PATH" ]]; then
            echo "Build completed but no .vst3 bundle was found." >&2
            find "$SOURCE_ROOT/build_mojave" -maxdepth 7 -print || true
            exit 1
          fi
          echo "Compiled plugin: $PLUGIN_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$PLUGIN_PATH" "$GITHUB_WORKSPACE/RECTIFI_ExtendedModes_Mojave_x86_64_VST3.zip"
          file "$PLUGIN_PATH/Contents/MacOS/"*

      - name: Update repository source ZIP with successful build fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_ROOT" "$GITHUB_WORKSPACE/RECTIFI_VST3_ExtendedModes_Source.zip" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          root = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2])
          temp = output.with_suffix(".tmp.zip")
          root_arc = Path(root.name)
          with zipfile.ZipFile(temp, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in {"build_mojave", "build_dsp_local"} for part in relative.parts):
                      continue
                  archive.write(path, (root_arc / relative).as_posix())
          temp.replace(output)
          print(f"Prepared corrected source archive: {output} ({output.stat().st_size} bytes)")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RECTIFI_VST3_ExtendedModes_Source.zip
          if ! git diff --cached --quiet; then
            git commit -m "Fix JUCE 6.1.6 source compatibility [skip ci]"
            git push origin HEAD:main
          else
            echo "Source ZIP is already up to date."
          fi

      - name: Upload VST3 and build log
        uses: actions/upload-artifact@v4
        with:
          name: RECTIFI_ExtendedModes_Mojave_x86_64
          path: |
            RECTIFI_ExtendedModes_Mojave_x86_64_VST3.zip
            RECTIFI_Mojave_Build.log
          if-no-files-found: error
          retention-days: 14
